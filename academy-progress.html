<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="description" content="Progress tracker for Neurodivergent Voices Academy."><title>Academy Progress • Neurodivergent Voices</title><style>
:root{--red:#c62828;--border:#e5ded8;--blue:#1259c3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#252525;line-height:1.55}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5}nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;text-decoration:none;color:inherit}.brand small{display:block;color:#666}main{padding:32px 0}.hero,.card{border:1px solid var(--border);border-radius:20px;padding:24px;background:#fff;margin-bottom:16px}.hero{background:linear-gradient(135deg,#fff8f4,#fff)}h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.bar{height:10px;background:#eee;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#eee}.pill{display:inline-block;background:#f8e8e8;color:#941d1d;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}
</style><style id="professional-theme">
:root{--ink:#1d2433;--muted:#657084;--brand:#315c8c;--soft:#f4f7fb;--line:#dfe6ee;--focus:#0b63ce;--shadow:0 18px 45px rgba(30,50,75,.09)}
body{background:var(--soft)!important;color:var(--ink)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
header{background:rgba(255,255,255,.96)!important;border-color:var(--line)!important;backdrop-filter:blur(12px)}
.wrap{width:min(1160px,calc(100% - 32px))!important}nav{min-height:74px!important}
.brand{display:flex!important;align-items:center;gap:10px}.brand:before{content:"NV";display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--brand);color:white;font-weight:900}.brand small{color:var(--muted)!important}
main{padding:38px 0 70px!important}.hero,.panel,.card{border-color:var(--line)!important;border-radius:24px!important;box-shadow:var(--shadow);background:#fff}.hero{background:linear-gradient(135deg,#eef4fa,#fff 70%,#f7f2e9)!important;padding:34px!important}.pill{background:#e8f0f7!important;color:var(--brand)!important}
h1{letter-spacing:-.035em!important}.btn,.actions button{border-radius:12px!important}.primary{background:var(--brand)!important}.secondary{background:#edf1f5!important;color:var(--ink)!important}
.bar,.progress{background:#e8edf2!important}.fill,.progress i{background:var(--brand)!important}.subject{min-height:150px}.card{padding:22px!important}
a:focus,button:focus,input:focus,select:focus{outline:3px solid var(--focus);outline-offset:3px}
@media(max-width:600px){.hero,.panel,.card{padding:20px!important}}
</style></head><body><header><div class="wrap"><nav><a class="brand" href="academy-dashboard.html">Neurodivergent Voices <small>Academy • Pre-K–5</small></a><div><a href="academy.html">Lessons</a> &nbsp; <a href="academy-dashboard.html">Dashboard</a></div></nav></div></header><main class="wrap"><section class="hero"><span class="pill">PROGRESS</span><h1>Learning progress</h1><p>Progress is saved locally on this device. “Demonstrated” and “Mastered” record the stage selected in the lesson.</p></section><section class="card"><h2>All Academy</h2><p id="overall"></p><div class="bar"><div id="overallFill" class="fill"></div></div></section><section><h2>By grade</h2><div id="grades" class="grid"></div></section><section class="card"><h2>Tools</h2><div class="actions"><button class="btn primary" id="export">Export progress</button><button class="btn secondary" id="reset">Reset this device</button></div></section></main><script src="academy-data.js"></script><script>
const STORAGE="nva_academy_progress_v5";const LEGACY="nva_academy_progress_v4";const $=id=>document.getElementById(id);const safe=()=>{try{return JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(LEGACY)||"{}")}catch(e){return{}}};const status=x=>typeof x==="string"?x:(x&&x.status)||"Not Started";const done=x=>["Demonstrated","Mastered"].includes(status(x));
function render(){const p=safe(),keys=Object.keys(p).filter(k=>/^\d+-\d+-\d+-\d+$/.test(k)),total=5600,c=keys.filter(k=>done(p[k])).length,m=keys.filter(k=>status(p[k])==="Mastered").length;$("overall").innerHTML="<strong>"+c+" of "+total+"</strong> lessons demonstrated or mastered • <strong>"+m+"</strong> mastered";$("overallFill").style.width=Math.min(100,c/total*100)+"%";$("grades").innerHTML=ACADEMY.grades.map((g,i)=>{let d=0,m=0,l=0;for(const k of keys)if(k.startsWith(i+"-")){if(done(p[k]))d++;if(status(p[k])==="Mastered")m++;if(status(p[k])==="Learning")l++}const totalG=800;return '<div class="card"><h3>'+g+'</h3><p>'+d+' of '+totalG+' completed</p><div class="bar"><div class="fill" style="width:'+Math.min(100,d/totalG*100)+'%"></div></div><p>'+m+' mastered • '+l+' learning</p></div>'}).join("")}
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({academy:"Neurodivergent Voices Academy",version:5,exported:new Date().toISOString(),progress:safe()},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="neurodivergent-voices-academy-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("reset").onclick=()=>{if(confirm("Reset all Academy progress stored on this device?")){localStorage.removeItem(STORAGE);render()}};render();
</script></body></html>
