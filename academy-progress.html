<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Progress tracker for Neurodivergent Voices Academy."><title>Academy Progress • Neurodivergent Voices</title><style>
:root{--red:#c62828;--border:#e5ded8;--blue:#1259c3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#252525;line-height:1.55}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5}nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;text-decoration:none;color:inherit}.brand small{display:block;color:#666}main{padding:32px 0}.hero,.card{border:1px solid var(--border);border-radius:20px;padding:24px;background:#fff;margin-bottom:16px}.hero{background:linear-gradient(135deg,#fff8f4,#fff)}h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.bar{height:10px;background:#eee;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#eee}.pill{display:inline-block;background:#f8e8e8;color:#941d1d;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}
</style></head><body><header><div class="wrap"><nav><a class="brand" href="academy-dashboard.html">Neurodivergent Voices <small>Academy • Pre-K–5</small></a><div><a href="academy.html">Lessons</a> &nbsp; <a href="academy-dashboard.html">Dashboard</a></div></nav></div></header><main class="wrap"><section class="hero"><span class="pill">PROGRESS</span><h1>Learning progress</h1><p>Progress is saved locally on this device. “Demonstrated” and “Mastered” record the stage selected in the lesson.</p></section><section class="card"><h2>All Academy</h2><p id="overall"></p><div class="bar"><div id="overallFill" class="fill"></div></div></section><section><h2>By grade</h2><div id="grades" class="grid"></div></section><section class="card"><h2>Tools</h2><div class="actions"><button class="btn primary" id="export">Export progress</button><button class="btn secondary" id="reset">Reset this device</button></div></section></main><script src="academy-data.js"></script><script>
const STORAGE="nva_academy_progress_v4";const $=id=>document.getElementById(id);const safe=()=>{try{return JSON.parse(localStorage.getItem(STORAGE)||"{}")}catch(e){return{}}};const done=x=>["Demonstrated","Mastered"].includes(x);
function render(){const p=safe(),total=5600,c=Object.values(p).filter(done).length,m=Object.values(p).filter(x=>x==="Mastered").length;$("overall").innerHTML="<strong>"+c+" of "+total+"</strong> lessons demonstrated or mastered • <strong>"+m+"</strong> mastered";$("overallFill").style.width=Math.min(100,c/total*100)+"%";$("grades").innerHTML=ACADEMY.grades.map((g,i)=>{let d=0,m=0,l=0;for(const k in p)if(k.startsWith(i+"-")){if(done(p[k]))d++;if(p[k]==="Mastered")m++;if(p[k]==="Learning")l++}const totalG=800;return '<div class="card"><h3>'+g+'</h3><p>'+d+' of '+totalG+' completed</p><div class="bar"><div class="fill" style="width:'+Math.min(100,d/totalG*100)+'%"></div></div><p>'+m+' mastered • '+l+' learning</p></div>'}).join("")}
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({academy:"Neurodivergent Voices Academy",version:4,exported:new Date().toISOString(),progress:safe()},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="neurodivergent-voices-academy-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("reset").onclick=()=>{if(confirm("Reset all Academy progress stored on this device?")){localStorage.removeItem(STORAGE);render()}};render();
</script></body></html>
